name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Kotlin/JS
        run: ./gradlew build -x allTests

      - name: Inspect build output
        run: |
          echo "=== All index.html files ==="
          find build -name index.html -type f

          echo ""
          echo "=== build/dist ==="
          find build/dist -maxdepth 5 -type f 2>/dev/null | head -100

          echo ""
          echo "=== Kotlin JS directories ==="
          find build -type d \( -name "*production*" -o -name "*executable*" \) 2>/dev/null

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/dist

      - name: Deploy
        uses: actions/deploy-pages@v4